<section class="note" id="cl-about">
  <h2><span class="n">01</span> Planned pages</h2>
  <p>Give a page <code>"status": "planned"</code> in <code>site.json</code> and it shows on the home page as a greyed row with a <em>Coming later</em> badge, and as a disabled entry in the page switcher. Its content file does not need to exist yet.</p>
</section>
