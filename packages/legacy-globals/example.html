<section class="note" id="lg-about">
  <h2><span class="n">01</span> Old scripts, new site</h2>
  <p>This demo site maps an old global <code>OldNotes</code> onto the template: <code>OldNotes.store</code>
  is <code>Study.store</code>. The script below was written against the old name and runs unchanged.</p>
  <div class="widget" id="lg-demo">
    <div class="lbl">Try it · A counter saved the old way</div>
    <div class="controls"><button class="btn" type="button" id="lg-plus">Add one</button><button class="btn" type="button" id="lg-reset">Reset</button></div>
    <div class="out"><span class="k">count</span><span id="lg-out"></span></div>
  </div>
  <script>
    (function () {
      const store = window.OldNotes.store;   // written for the old site; served by Study.store now
      const show = () => { document.getElementById('lg-out').textContent = store.get('lg-count', 0); };
      document.getElementById('lg-plus').addEventListener('click', () => { store.set('lg-count', store.get('lg-count', 0) + 1); show(); });
      document.getElementById('lg-reset').addEventListener('click', () => { store.set('lg-count', 0); show(); });
      show();
    })();
  </script>
</section>
