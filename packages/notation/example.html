<section class="note" id="nt-tags">
  <h2><span class="n">01</span> One colour per kind of word</h2>
  <p>With <code>"tags": {"noun": …, "verb": …, "adj": …}</code> each kind keeps its colour on every page:</p>
  <p class="eq"><span class="adj">Quiet</span> <span class="noun">rivers</span> <span class="verb">run</span> <span class="adj">deep</span>.</p>
</section>
<section class="note" id="nt-table">
  <h2><span class="n">02</span> A value table</h2>
  <p>Two switches wired in series: the lamp is on only when both are.</p>
  <div class="tablewrap"><table class="t tt">
    <thead><tr><th>switch A</th><th>switch B</th><th class="sep final">lamp</th></tr></thead>
    <tbody>
      <tr><td class="T">on</td><td class="T">on</td><td class="sep final T">on</td></tr>
      <tr class="hot"><td class="T">on</td><td class="F">off</td><td class="sep final F">off</td></tr>
      <tr><td class="F">off</td><td class="T">on</td><td class="sep final F">off</td></tr>
      <tr><td class="F">off</td><td class="F">off</td><td class="sep final F">off</td></tr>
    </tbody>
  </table></div>
</section>
