# Build the demo site (demo/) with the template's own tools and publish it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages reads the repository's Pages settings
    steps:
      - uses: actions/checkout@v6
      - name: Check every package follows the contract
        run: python3 tools/study.py packages --check
      - name: Check the demo
        run: python3 tools/study.py check demo
      - name: Build the demo
        run: python3 tools/study.py build demo --strict
      - name: Build and check a scaffolded site with every package
        run: |
          python3 tools/study.py new "$RUNNER_TEMP/scaffold" --demo
          python3 tools/study.py check "$RUNNER_TEMP/scaffold"
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
